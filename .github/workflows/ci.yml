name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bandits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m bandits --horizon 200 --runs 20

  game:
    name: Game
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
